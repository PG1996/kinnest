services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kinnest
      POSTGRES_PASSWORD: kinnest
      POSTGRES_DB: kinnest
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinnest"]
      interval: 3s
      retries: 20

  api:
    build: ../backend
    env_file: ../.env
    ports: ["8000:8000"]
    volumes: ["../backend:/app"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ../backend
    env_file: ../.env
    volumes: ["../backend:/app"]
    command: python -c "import time; print('worker stub'); time.sleep(10**9)"
    depends_on:
      db: {condition: service_healthy}

  web:
    build: ../frontend
    ports: ["5173:5173"]
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes: ["../frontend:/app", "/app/node_modules"]
    depends_on: [api]

volumes:
  dbdata:
