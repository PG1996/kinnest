name: kinnest-prod

# "Real use" stack. Image-only: it never builds, so a release bundle holding only deploy/ is enough.
#   Mac (builds locally):  docker-compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.build.yml --env-file .env up -d --build
#   AWS VM:                deploy/deploy.sh (digest-pinned images from GHCR, see deploy/AWS_SETUP.md)
# Optional services are switched on with COMPOSE_PROFILES in .env: "worker" (reminders), "ngrok" (public tunnel).
# Mac: COMPOSE_PROFILES=worker, PUBLIC_HOST=:80, CADDY_HTTP_PORT=8080 (plain HTTP; the tunnel adds HTTPS).
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: kinnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kinnest
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinnest"]
      interval: 5s
      retries: 20

  api:
    image: ${KINNEST_API_IMAGE:-kinnest-api:local}
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    depends_on:
      db: {condition: service_healthy}

  worker:
    image: ${KINNEST_API_IMAGE:-kinnest-api:local}
    profiles: [worker]
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    command: python -m app.worker.main
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: ${KINNEST_WEB_IMAGE:-kinnest-web:local}
    restart: unless-stopped
    logging: *logging
    # loopback only: the tunnel (ngrok service, or cloudflared on the Mac) reaches Caddy inside the network or on this port
    ports: ["127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

  ngrok:
    image: ngrok/ngrok:3
    profiles: [ngrok]
    restart: unless-stopped
    logging: *logging
    command: ["http", "--url=${NGROK_DOMAIN:-unset.invalid}", "caddy:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on: [caddy]

volumes:
  dbdata:
  caddy_data:
  caddy_config:
