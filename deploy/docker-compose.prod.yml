# "Real use" stack: the same on your Mac (behind a tunnel) and later on a hosted VM. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Mac: PUBLIC_HOST=:80 and CADDY_HTTP_PORT=8080 (plain HTTP; the tunnel adds HTTPS). VM: PUBLIC_HOST=<your host> (Caddy gets HTTPS).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinnest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kinnest
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinnest"]
      interval: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    command: python -m app.worker.main
    depends_on:
      db: {condition: service_healthy}

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports: ["${CADDY_HTTP_PORT:-80}:80", "${CADDY_HTTPS_PORT:-443}:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]

volumes:
  dbdata:
  caddy_data:
  caddy_config:
