name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: kinnest
          POSTGRES_PASSWORD: kinnest
          POSTGRES_DB: kinnest
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kinnest" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx oxlint src --max-warnings 34   # the baseline: do not add more
        working-directory: frontend

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n deploy/*.sh
      - run: shellcheck --severity=warning deploy/*.sh
      - name: compose files resolve
        env:
          POSTGRES_PASSWORD: x
          PUBLIC_HOST: ":80"
        run: |
          touch .env
          docker compose -f deploy/docker-compose.prod.yml --env-file .env config -q
          COMPOSE_PROFILES=worker,ngrok NGROK_DOMAIN=d.example NGROK_AUTHTOKEN=t \
            docker compose -f deploy/docker-compose.prod.yml --env-file .env config -q
          docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.build.yml --env-file .env config -q
